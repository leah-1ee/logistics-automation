name: MVP contracts and software checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run verify:documents
      - run: npm test
      - run: npm run build
      - run: python3 tools/init-env.py
      - run: make fixture
      - run: docker compose up -d --wait mysql redis
      - run: npm run migrate
      - run: npm run seed
        env: {PREPARED_DB: data/prepared/fixture.sqlite}
      - run: npm run init:test-db
      - run: node --import tsx --env-file=.env.test tools/migrate.ts
      - run: npm run test:integration
