components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      description: 운영자 token
    deviceAuth:
      type: http
      scheme: bearer
      description: 등록 단말 전용 token. deviceId와 소유권 확인
  schemas:
    Problem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - requestId
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        database:
          type: string
          enum:
          - up
          - down
          - not_checked
        redis:
          type: string
          enum:
          - up
          - down
          - not_checked
        version:
          type: string
      required:
      - status
      - database
      - redis
      - version
      additionalProperties: false
    TaskItem:
      type: object
      properties:
        productId:
          type: string
          pattern: ^[a-f0-9]{32}$
        displayLabel:
          type: string
        requiredQty:
          type: integer
          minimum: 1
        appliedQty:
          type: integer
          minimum: 0
      required:
      - productId
      - displayLabel
      - requiredQty
      - appliedQty
      additionalProperties: false
    SnapshotItem:
      type: object
      properties:
        productId:
          type: string
          pattern: ^[a-f0-9]{32}$
        displayLabel:
          type: string
        requiredQty:
          type: integer
          minimum: 1
      required:
      - productId
      - displayLabel
      - requiredQty
      additionalProperties: false
    TaskSnapshot:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        datasetRunId:
          type: string
          format: uuid
        externalOrderId:
          type: string
        assignmentVersion:
          type: integer
          minimum: 1
        deviceId:
          type: string
          minLength: 1
        requiredItems:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotItem'
          minItems: 1
        snapshotHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        assignedAt:
          type: string
          format: date-time
      required:
      - taskId
      - datasetRunId
      - externalOrderId
      - assignmentVersion
      - deviceId
      - requiredItems
      - snapshotHash
      - assignedAt
      additionalProperties: false
      description: 배정 후 불변. snapshotHash 자체를 제외한 모든 필드의 canonical JSON SHA-256.
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datasetRunId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - ASSIGNED
          - IN_PROGRESS
          - HOLD
          - CONFIRMED
        deviceId:
          type:
          - string
          - 'null'
        assignmentVersion:
          type: integer
          minimum: 0
        lastProcessedSeq:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskItem'
          minItems: 1
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        holdReason:
          type:
          - string
          - 'null'
      required:
      - id
      - datasetRunId
      - orderId
      - status
      - deviceId
      - assignmentVersion
      - lastProcessedSeq
      - items
      - confirmedAt
      - holdReason
      additionalProperties: false
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datasetRunId:
          type: string
          format: uuid
        sourceOrderId:
          type: string
        sourceStatus:
          type: string
        status:
          type: string
          enum:
          - RECEIVED
          - DATA_HOLD
          - UNSUPPORTED
          - READY
          - TASK_CREATED
        revision:
          type: integer
          minimum: 1
        holdReasons:
          type: array
          items:
            type: string
        taskId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - datasetRunId
      - sourceOrderId
      - sourceStatus
      - status
      - revision
      - holdReasons
      - taskId
      additionalProperties: false
    OrderDetail:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/Order'
        raw:
          type: object
          additionalProperties: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotItem'
        audit:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - order
      - raw
      - items
      - audit
      additionalProperties: false
    TaskDetail:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/Task'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventResult'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        eventBodies:
          type: array
          items: {$ref: '#/components/schemas/DeviceEvent'}
        syncIncidents:
          type: array
          items: {type: object, additionalProperties: true}
      required:
      - task
      - events
      - notes
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CREATE_TASK
          - REBUILD_REPORT_DAY
        status:
          type: string
          enum:
          - PENDING
          - DISPATCHED
          - DONE
          - FAILED
        attempts:
          type: integer
          minimum: 0
        errorCode:
          type:
          - string
          - 'null'
        availableAt:
          type: string
          format: date-time
      required:
      - id
      - type
      - status
      - attempts
      - errorCode
      - availableAt
      additionalProperties: false
    DeviceStatusReport:
      type: object
      properties:
        appVersion:
          type: string
        observedAt:
          type: string
          format: date-time
        pendingCount:
          type: integer
          minimum: 0
        blockedTaskCount:
          type: integer
          minimum: 0
        oldestPendingAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - appVersion
      - observedAt
      - pendingCount
      - blockedTaskCount
      - oldestPendingAt
      additionalProperties: false
    Device:
      type: object
      properties:
        id:
          type: string
        enabled:
          type: boolean
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        lastReport:
          oneOf:
          - $ref: '#/components/schemas/DeviceStatusReport'
          - type: 'null'
        stale:
          type: boolean
      required:
      - id
      - enabled
      - lastSeenAt
      - lastReport
      - stale
      additionalProperties: false
    Receipt:
      type: object
      properties:
        committedAt:
          type: string
          format: date-time
        processedSeq:
          type: integer
          minimum: 1
        taskStatus:
          type: string
          enum:
          - CREATED
          - ASSIGNED
          - IN_PROGRESS
          - HOLD
          - CONFIRMED
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        appliedItems:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                pattern: ^[a-f0-9]{32}$
              quantity:
                type: integer
                minimum: 0
            required:
            - productId
            - quantity
            additionalProperties: false
      required:
      - committedAt
      - processedSeq
      - taskStatus
      - confirmedAt
      - appliedItems
      additionalProperties: false
    EventResult:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        result:
          type: string
          enum:
          - APPLIED
          - DUPLICATE
          - REJECTED
          - DEFERRED
          - BLOCKED
        originalResult:
          type: string
          enum:
          - APPLIED
          - REJECTED
        code:
          type: string
        retryable:
          type: boolean
        expectedSeq:
          type: integer
          minimum: 1
        receipt:
          $ref: '#/components/schemas/Receipt'
      required:
      - eventId
      - taskId
      - result
      - code
      - retryable
      additionalProperties: false
      description: APPLIED/REJECTED는 영구 receipt 필수. DUPLICATE는 originalResult와 최초 receipt 필수. DEFERRED/BLOCKED는
        seq 미소비.
      allOf:
      - if:
          properties:
            result:
              enum:
              - APPLIED
              - REJECTED
              - DUPLICATE
          required:
          - result
        then:
          required:
          - receipt
      - if:
          properties:
            result:
              const: DUPLICATE
          required:
          - result
        then:
          required:
          - originalResult
